<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Embed Test — GHL Funnel Simulation</title>
<style>
  body { font-family: sans-serif; margin: 0; padding: 0; }
  .fake-funnel-nav { background: #222; color: #fff; padding: 16px; text-align: center; }
  .fake-ghl-form { max-width: 780px; margin: 20px auto; padding: 20px; border: 2px dashed #888; background: #fafafa; }
  .fake-ghl-form h3 { margin-top: 0; color: #666; font-size: 14px; }
</style>
</head>
<body>
<div class="fake-funnel-nav">FAKE FUNNEL HEADER (your GHL funnel UI lives here)</div>

<!-- The widget injects itself into this div -->
<div id="rx-lookup-widget"></div>

<!-- Simulates the GHL form the user will build: 4 hidden fields + a submit button -->
<div class="fake-ghl-form">
  <h3>↓ SIMULATED GHL HIDDEN FORM ↓</h3>
  <form id="ghl-form" onsubmit="event.preventDefault(); alert(JSON.stringify({
    medications_json: this.medications_json.value.substring(0,200),
    medications_summary: this.medications.value,
    providers_json: this.providers_json.value.substring(0,200),
    doctors_summary: this.doctors.value
  }, null, 2));">
    <input type="hidden" name="medications_json">
    <input type="hidden" name="medications">
    <input type="hidden" name="providers_json">
    <input type="hidden" name="doctors">
    <button type="submit" style="padding: 12px 24px; background: #1e4d8c; color: #fff; border: none; border-radius: 4px; font-size: 16px; cursor: pointer;">Continue → (GHL form submit)</button>
  </form>
</div>

<!-- This is the ONLY line the user adds to their GHL Custom Code block (besides the div above) -->
<script src="./dist/embed.js"></script>
</body>
</html>
